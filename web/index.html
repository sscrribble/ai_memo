<!doctype html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AI 메모">
  <title>AI 메모</title>
  <script>
    // 첫 화면이 깜빡이지 않도록 테마를 먼저 적용 (기본: 다크)
    try { document.documentElement.dataset.theme = localStorage.getItem("memo_theme") || "dark"; } catch (e) {}
  </script>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="/style.css">
  <!-- 글꼴은 인터넷이 될 때만 불러오고, 안 되면 기기 기본 글꼴 사용 -->
  <link rel="stylesheet" media="print" onload="this.media='all'"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
</head>
<body>
  <div id="login" class="login" hidden>
    <form id="login-form" class="login-box">
      <img src="/icon.svg" alt="" width="52" height="52">
      <h1>AI 메모</h1>
      <p class="login-sub">비밀번호를 입력하세요</p>
      <input id="login-pw" type="password" placeholder="비밀번호" autocomplete="current-password" required>
      <button type="submit" class="btn primary">로그인</button>
      <p id="login-err" class="err"></p>
    </form>
  </div>

  <div id="fatal" class="login" hidden>
    <div class="login-box">
      <img src="/icon.svg" alt="" width="52" height="52">
      <h1>서버에 연결할 수 없습니다</h1>
      <p class="login-sub">서버가 켜져 있는지, 주소가 맞는지 확인해 주세요.</p>
      <button id="fatal-retry" type="button" class="btn primary">다시 시도</button>
    </div>
  </div>

  <div id="app" class="app" hidden>
    <aside class="side">
      <div class="brand"><img src="/icon.svg" alt="" width="28" height="28"><span>AI 메모</span></div>
      <nav class="nav" id="nav">
        <button data-view="all"><i data-icon="notes"></i><span>전체</span></button>
        <button data-view="todo"><i data-icon="check"></i><span>할 일</span><span class="count" data-count="todo"></span></button>
        <button data-view="calendar"><i data-icon="calendar"></i><span>캘린더</span></button>
        <button data-view="shopping"><i data-icon="cart"></i><span>장보기</span><span class="count" data-count="shopping"></span></button>
      </nav>
      <div class="side-foot">
        <span class="sync-label"><span class="sync"></span><span class="sync-text">연결 중</span></span>
        <button class="icon-btn theme-toggle" type="button" aria-label="밝은/어두운 화면 전환"></button>
      </div>
    </aside>

    <div class="main">
      <div class="main-inner">
        <header class="top">
          <div class="heading">
            <p class="today" id="today"></p>
            <h1 id="view-title"></h1>
          </div>
          <label class="search">
            <i data-icon="search"></i>
            <input id="search" type="search" placeholder="검색" aria-label="검색">
          </label>
          <button class="icon-btn" id="open-settings" type="button" aria-label="설정 (알림·백업·휴지통)"><i data-icon="settings"></i></button>
          <button class="icon-btn theme-toggle only-mobile" type="button" aria-label="밝은/어두운 화면 전환"></button>
        </header>

        <div id="offline" class="offline" role="status" hidden></div>
        <div id="banners" class="banners" aria-live="polite"></div>

        <form id="compose" class="compose">
          <textarea id="compose-text" rows="2" aria-label="새 메모"
                    placeholder="무엇이든 적으세요.&#10;예) 내일 3시 치과 / 우유, 계란 사기"></textarea>
          <div class="compose-bar">
            <span id="ai-hint" class="hint"></span>
            <span class="kbd">Ctrl + Enter</span>
            <button type="submit" class="btn primary">저장</button>
          </div>
        </form>

        <section id="view"></section>
      </div>
    </div>
  </div>

  <dialog id="settings" class="sheet" aria-labelledby="settings-title">
    <div class="sheet-head">
      <h2 id="settings-title">설정</h2>
      <button class="icon-btn" id="settings-close" type="button" aria-label="닫기"><i data-icon="close"></i></button>
    </div>

    <section class="set-sec" aria-labelledby="sec-notify">
      <h3 id="sec-notify">알림</h3>
      <div class="set-row">
        <div><strong>이 기기에서 알림 받기</strong><p id="push-status"></p></div>
        <button class="btn" id="push-toggle" type="button"></button>
      </div>
      <label class="set-row"><div><strong>아침 요약</strong><p>오늘 할 일과 지난 일을 한 번에</p></div><select id="set-morning"></select></label>
      <label class="set-row"><div><strong>전날 알림</strong><p>내일 일정과 마감</p></div><select id="set-evening"></select></label>
      <label class="set-row"><div><strong>일정 직전 알림</strong><p>시간이 정해진 일정</p></div><select id="set-lead"></select></label>
      <button class="btn ghost flush" id="push-test" type="button">테스트 알림 보내기</button>
    </section>

    <section class="set-sec" aria-labelledby="sec-backup">
      <h3 id="sec-backup">백업</h3>
      <div class="set-row">
        <div><strong>자동 백업</strong><p id="backup-status"></p><p class="path" id="backup-dir"></p></div>
        <button class="btn" id="backup-now" type="button">지금 백업</button>
      </div>
      <div class="set-row wrap">
        <div><strong>파일로 보관·옮기기</strong><p>내보낸 파일은 다른 서버에서 가져올 수 있습니다</p></div>
        <div class="btns">
          <button class="btn" id="export" type="button">내보내기</button>
          <button class="btn" id="import" type="button">가져오기</button>
        </div>
      </div>
      <input type="file" id="import-file" accept=".json,application/json" hidden>
    </section>

    <section class="set-sec" id="sec-app" aria-labelledby="sec-app-title" hidden>
      <h3 id="sec-app-title">앱</h3>
      <div class="set-row">
        <div><strong>서버 주소</strong><p class="path" id="app-server"></p></div>
        <button class="btn" id="app-change-server" type="button">바꾸기</button>
      </div>
      <div class="set-row" id="app-battery-row">
        <div><strong>배터리 사용 제한 해제</strong><p>해제해야 화면이 꺼져 있어도 알림이 제때 옵니다</p></div>
        <button class="btn" id="app-battery" type="button">해제</button>
      </div>
    </section>

    <section class="set-sec" aria-labelledby="sec-trash">
      <h3 id="sec-trash">휴지통</h3>
      <div id="trash"></div>
    </section>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>
  <script src="/recur.js"></script>
  <script src="/app.js"></script>
</body>
</html>
